<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMF2115 pose editor</title>
<style>
:root{--bg:#0e1319;--panel:#171e27;--line:#2a3441;--text:#dbe4ee;--dim:#8b9bad;--accent:#58b6e8;--ok:#4fbf7a;--warn:#e0b341;--bad:#e0675c}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f8;--panel:#fff;--line:#d5dce5;--text:#1b2430;--dim:#5b6b7d;--accent:#1a78b3;--ok:#1f8f4e;--warn:#a87a00;--bad:#c0392b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}
button,select,input[type=search],input[type=number]{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
label{color:var(--dim);display:inline-flex;gap:4px;align-items:center}
#stat{color:var(--dim);margin-left:auto}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;padding:14px 16px;max-width:1700px;margin:auto}
nav{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:64px;align-self:start}
nav .har{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 8px 2px}
nav button{display:flex;width:100%;justify-content:space-between;gap:6px;text-align:left;border:0;background:transparent;border-radius:6px;padding:5px 8px}
nav button.on{background:var(--bg);outline:1px solid var(--accent)}
nav .n{color:var(--dim);font-size:12px;white-space:nowrap}nav .done{color:var(--ok)}
.title{margin:0 0 4px;font-size:16px}.meta{color:var(--dim);font-size:13px;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.card.reviewed{border-color:var(--ok)}
.head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:12px;border:1px solid currentColor;border-radius:99px;padding:0 8px}
.authored{color:var(--ok)}.auto{color:var(--accent)}.reference{color:var(--accent)}.default{color:var(--warn)}
.stage{background:#000;border-radius:6px;overflow:hidden;touch-action:none}
.stage svg{display:block;width:100%;height:auto}
.stage image{image-rendering:pixelated}.stage image.hd{image-rendering:auto}
circle.j{cursor:grab;stroke:#fff;stroke-width:.5}circle.j:active{cursor:grabbing}
.ctl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;align-items:center}
.out{font:12px ui-monospace,Consolas,monospace;color:var(--dim);margin-top:6px;white-space:pre-wrap}
.note{color:var(--warn);font-size:12px}
.help{color:var(--dim);font-size:13px;margin:0 0 10px}
@media (max-width:900px){.layout{grid-template-columns:1fr}nav{position:static;max-height:240px}}
</style></head><body>
<header><h1>OMF2115 pose editor</h1>
<label><input type="checkbox" id="hideDone"> hide reviewed</label>
<label>reference <select id="refMode" title="What to draw the skeleton over. The remastered frames are the same poses at 5x/6x resolution."><option value="orig">original sprite</option><option value="hd">remastered HD</option><option value="blend">blend</option></select></label>
<button id="exportBtn" class="primary" title="Every reviewed sprite of every move">Download all reviewed</button>
<button id="exportMoveBtn" title="Only the reviewed sprites of the move shown">Download this move</button>
<button id="clearBtn" title="Forget all edits stored in this browser">Clear edits</button>
<span id="stat"></span></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>
<script>
const DATA=__DATA__, KEY='omf3k-pose-editor-v1', REF_KEY='omf3k-pose-editor-ref';
let refMode='orig';try{refMode=localStorage.getItem(REF_KEY)||'orig'}catch(e){}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let saved={}; try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}};
const key=(e,s)=>`${e.har}:${e.animation}:${s.sprite}`;
const clone=o=>JSON.parse(JSON.stringify(o));
function state(e,s){const k=key(e,s);if(!saved[k])saved[k]={skel:clone(s.skel),flags:[...s.flags],reach:s.reach,fist:s.fist,reviewed:false,axis:s.axis,side:s.side};const st=saved[k];st.axis=s.axis;if(st.side==null)st.side=s.side;const q=st.skel;if(!q.elbow2){q.elbow2=clone(s.skel.elbow2||s.skel.elbow);q.wrist2=clone(s.skel.wrist2||s.skel.wrist)}if(!q.neck)q.neck=clone(st.top||s.skel.neck);if(!q.head)q.head=clone(s.skel.head);delete st.top;if(st.tail===undefined)st.tail=null;if(!st.tips)st.tips={arm:null,arm2:null};if(!st.opt)st.opt={shR:null,shL:null,heR:null,heL:null};clampSkel(s,st);return st}
function pxToRigY(har,y){const m=DATA.ymaps[har],p=m.px,r=m.rig,n=p.length;
 if(y>p[n-1])return r[n-1]+(y-p[n-1])*(r[n-1]-r[n-2])/(p[n-1]-p[n-2]);
 if(y<p[0])return r[0]+(y-p[0])*(r[1]-r[0])/(p[1]-p[0]);
 for(let i=1;i<n;i++)if(y<=p[i])return r[i-1]+(y-p[i-1])*(r[i]-r[i-1])/(p[i]-p[i-1]);return r[n-1]}
const rig=(e,s,pt)=>[pxToRigY(e.har,pt[1]),-(pt[0]-state(e,s).axis)*DATA.unit];
const f2=v=>(Math.round(v*100)/100).toFixed(2);
const PAD=30, PIVOT_Y=1.38;   // sprite pixels of free space around each sprite; the rig's lean pivot height
function rigToPxY(har,y){const m=DATA.ymaps[har],p=m.px,r=m.rig,n=r.length;
 if(y>r[n-1])return p[n-1]+(y-r[n-1])*(p[n-1]-p[n-2])/(r[n-1]-r[n-2]);
 if(y<r[0])return p[0]+(y-r[0])*(p[1]-p[0])/(r[1]-r[0]);
 for(let i=1;i<n;i++)if(y<=r[i])return p[i-1]+(y-r[i-1])*(p[i]-p[i-1])/(r[i]-r[i-1]);return p[n-1]}
function dropOf(e,st){return st.flags.includes('drop')?pxToRigY(e.har,st.skel.pelvis[1])-DATA.ymaps[e.har].rig[2]:0}
function leanOf(e,st){const k=st.skel,dy=pxToRigY(e.har,k.neck[1])-pxToRigY(e.har,k.pelvis[1]);return dy<.3?0:(k.neck[0]-k.pelvis[0])*DATA.unit/dy}
function clampSkel(s,st){const x0=s.ox-PAD+3,x1=s.ox+s.w+PAD-3,y1=-s.oy+PAD-3,y0=-(s.oy+s.h)-PAD+3,c=p=>{p[0]=Math.min(x1,Math.max(x0,p[0]));p[1]=Math.min(y1,Math.max(y0,p[1]))};
 const k=st.skel;if(!k.elbow2||!k.neck||!k.head)return;[k.elbow,k.wrist,k.elbow2,k.wrist2,k.pelvis,k.neck,k.head.top,k.head.left,k.head.right,k.legs[0].knee,k.legs[0].ankle,k.legs[1].knee,k.legs[1].ankle].forEach(c);(st.tail||[]).forEach(c);if(st.tips){if(st.tips.arm)c(st.tips.arm);if(st.tips.arm2)c(st.tips.arm2)}Object.values(st.opt||{}).forEach(p=>{if(p)c(p)})}
let cur=0;
function stats(){let t=0,d=0;for(const e of DATA.entries)for(const s of e.sprites){t++;if(saved[key(e,s)]?.reviewed)d++}$('#stat').textContent=`${d} of ${t} sprites reviewed`}
function nav(){let h='',last='';DATA.entries.forEach((e,i)=>{if(e.harName!==last){h+=`<div class="har">${e.harName}</div>`;last=e.harName}
 const d=e.sprites.filter(s=>saved[key(e,s)]?.reviewed).length;
 h+=`<button data-i="${i}" class="${i===cur?'on':''}"><span>${e.animation} ${esc(e.name)}</span><span class="n ${d===e.sprites.length?'done':''}">${d}/${e.sprites.length}</span></button>`});
 $('#nav').innerHTML=h}
$('#nav').addEventListener('click',ev=>{const b=ev.target.closest('button');if(b){cur=+b.dataset.i;render()}});
function readout(e,s,st){const dd=dropOf(e,st),a=rig(e,s,st.skel.elbow),w=rig(e,s,st.skel.wrist),e2=rig(e,s,st.skel.elbow2),w2=rig(e,s,st.skel.wrist2),k1=rig(e,s,st.skel.legs[0].knee),a1=rig(e,s,st.skel.legs[0].ankle),k2=rig(e,s,st.skel.legs[1].knee),a2=rig(e,s,st.skel.legs[1].ankle);
 const bz=-(st.skel.pelvis[0]-st.axis)*DATA.unit;
 return `lean  ${f2(leanOf(e,st))} (${st.flags.includes('lean')?'exported':'not exported; tick lean'})\ndrop  ${f2(dd)} (${st.flags.includes('drop')?'exported':'not exported; tick drop'})\narm   elbow ${f2(a[0]-dd)},${f2(a[1])}  wrist ${f2(w[0]-dd)},${f2(w[1])}\narm2  elbow ${f2(e2[0]-dd)},${f2(e2[1])}  wrist ${f2(w2[0]-dd)},${f2(w2[1])}\nleg   knee ${f2(k1[0])},${f2(k1[1])}  ankle ${f2(a1[0])},${f2(a1[1])}\nleg2  knee ${f2(k2[0])},${f2(k2[1])}  ankle ${f2(a2[0])},${f2(a2[1])}\nbody_z ${f2(bz)}${st.flags.includes('reach')&&w2[1]<w[1]-.3?'\nWARNING: arm2 reaches farther than arm, but reach and the punch contact use the active arm. Set active side to the punching arm side so it becomes arm.':''}`}
const SIDE_NAME=v=>v===1?'R':'L';
function refImages(s){const orig=`<image href="${esc(s.img)}" width="${s.w}" height="${s.h}"/>`;if(refMode==='orig'||!s.hd)return orig;
 const h=s.hd,hd=op=>`<image class="hd" href="${esc(h.img)}" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" preserveAspectRatio="none" opacity="${op}"/>`;
 return refMode==='hd'?hd(1):orig+hd(.6)}
function svgFor(e,s,st){const P=(x,y)=>[x-s.ox,-y-s.oy],sk=st.skel,pel=sk.pelvis,sh=[pel[0]+(sk.neck[0]-pel[0])*.72,pel[1]+(sk.neck[1]-pel[1])*.72];
 const act=SIDE_NAME(st.side),oth=SIDE_NAME(-st.side),o=st.opt||{},shA=(st.side===1?o.shR:o.shL)||sh,shB=(st.side===1?o.shL:o.shR)||sh;
 const TIPS={elbow:`${act} elbow (arm, side ${st.side>0?'+1':'-1'})`,wrist:`${act} wrist (arm)`,knee0:`${act} knee (leg)`,ankle0:`${act} ankle (leg)`,
  elbow2:`${oth} elbow (arm2, the other arm; moving it ticks arm2)`,wrist2:`${oth} wrist (arm2; moving it ticks arm2)`,knee1:`${oth} knee (leg2, the other leg)`,ankle1:`${oth} ankle (leg2)`,pelvis:'pelvis, the root of the skeleton: drag sideways for body_z, up or down for body height (drop). The spine, head and legs move with it.',
  neck:'neck, the top of the spine: drag to tilt the torso (the head points stay where they are). Tick lean to export the tilt.',
  shR:'R shoulder (the character\'s right; optional reference, not exported)',shL:'L shoulder (the character\'s left; optional reference, not exported)',heR:'R head edge (the character\'s right side of the head; optional reference, not exported)',heL:'L head edge (the character\'s left side of the head; optional reference, not exported)',tipArm:`${act} fingertip (optional reference, not exported)`,tipArm2:`${oth} fingertip (optional reference, not exported)`,tail0:'tail point 1 (optional reference chain from the pelvis, not exported)',tail1:'tail point 2 (reference only)',tail2:'tail point 3 (reference only)',headTop:'top of the head (reference only, not exported)',headL:'head back edge, behind the character (reference only, not exported)',headR:'head front edge, the face side (reference only, not exported)'};
 const line=(pts,c)=>`<polyline fill="none" stroke="${c}" stroke-width="1.2" points="${pts.map(p=>P(...p).join(',')).join(' ')}"/>`;
 const dot=(p,c,id,letter)=>{const q=P(...p);return `<circle class="j" data-id="${id}" cx="${q[0]}" cy="${q[1]}" r="1.9" fill="${c}"><title>${esc(TIPS[id])}</title></circle>`+
  (letter?`<text x="${q[0]+2.6}" y="${q[1]-2}" font-size="4.2" fill="#fff" stroke="#000" stroke-width=".7" paint-order="stroke" pointer-events="none">${letter}</text>`:'')};
 const diamond=(p,id,c)=>{const q=P(...p);return `<rect class="j" data-id="${id}" x="${q[0]-2.2}" y="${q[1]-2.2}" width="4.4" height="4.4" transform="rotate(45 ${q[0]} ${q[1]})" fill="${c}"><title>${esc(TIPS[id])}</title></rect>`};
 const sho=P(...sh),ax0=P(s.axis,0)[0];
 const optDots=['shR','shL','heR','heL'].filter(k=>o[k]).map(k=>dot(o[k],k.startsWith('sh')?'#ffab91':'#80deea',k,k.endsWith('R')?'R':'L')).join('')+(o.shR&&o.shL?line([o.shR,o.shL],'#ffab91'):'')+(o.heR&&o.heL?line([o.heR,o.heL],'#80deea'):'');
 return `<svg viewBox="${-PAD} ${-PAD} ${s.w+2*PAD} ${s.h+2*PAD}" data-key="${key(e,s)}"><rect x="${-PAD}" y="${-PAD}" width="${s.w+2*PAD}" height="${s.h+2*PAD}" fill="#05070a"/>
 <rect x="0" y="0" width="${s.w}" height="${s.h}" fill="none" stroke="#2a3441" stroke-width=".4"/>${refImages(s)}
 <line x1="${ax0}" x2="${ax0}" y1="${-PAD}" y2="${s.h+PAD}" stroke="#58b6e8" stroke-width=".3" stroke-dasharray="1 3"/><text x="${ax0+1}" y="${-PAD+5}" font-size="4" fill="#58b6e8" pointer-events="none">z=0</text>
 ${line([pel,sk.neck],'#58b6e8')}${line([sk.neck,sk.head.top],'#9ad7ff')}${line([sk.head.left,sk.head.top,sk.head.right],'#9ad7ff')}
 <circle cx="${sho[0]}" cy="${sho[1]}" r="1.4" fill="none" stroke="#ff5050" stroke-width=".5"><title>shoulder (on the spine, where the arms hang from; not exported)</title></circle>
 ${st.flags.includes('arm')?line([shA,sk.elbow,sk.wrist],'#ff5050')+dot(sk.elbow,'#ffd23f','elbow')+dot(sk.wrist,'#ff8c42','wrist',act):''}
 <g opacity="${st.flags.includes('arm2')?1:.55}">${line([shB,sk.elbow2,sk.wrist2],'#c77dff')}${dot(sk.elbow2,'#ffd23f','elbow2')}${dot(sk.wrist2,'#e0a3ff','wrist2',oth)}</g>
 ${st.flags.includes('leg')?line([pel,sk.legs[0].knee,sk.legs[0].ankle],'#50ff80')+dot(sk.legs[0].knee,'#ffd23f','knee0')+dot(sk.legs[0].ankle,'#50ff80','ankle0',act):''}
 ${st.flags.includes('leg2')?line([pel,sk.legs[1].knee,sk.legs[1].ankle],'#50c8ff')+dot(sk.legs[1].knee,'#ffd23f','knee1')+dot(sk.legs[1].ankle,'#50c8ff','ankle1',oth):''}
 ${st.tips&&st.tips.arm?line([sk.wrist,st.tips.arm],'#ffffff')+dot(st.tips.arm,'#ffffff','tipArm'):''}${st.tips&&st.tips.arm2?line([sk.wrist2,st.tips.arm2],'#ffffff')+dot(st.tips.arm2,'#ffffff','tipArm2'):''}${st.tail?line([pel,...st.tail],'#e6a23c')+st.tail.map((p,i)=>dot(p,'#e6a23c','tail'+i)).join(''):''}${optDots}${dot(pel,'#ff3df0','pelvis')}${dot(sk.neck,'#58b6e8','neck')}${dot(sk.head.top,'#9ad7ff','headTop')}${dot(sk.head.left,'#9ad7ff','headL')}${dot(sk.head.right,'#9ad7ff','headR')}</svg>`}
function card(e,s,i){const st=state(e,s),on=f=>st.flags.includes(f)?'checked':'';
 return `<section class="card ${st.reviewed?'reviewed':''}" data-i="${i}"><div class="head"><b>sprite ${s.sprite}</b><span class="badge ${s.source}">${s.source}</span>${refMode!=='orig'&&!s.hd?'<span class="note">no HD frame</span>':''}${s.note?`<span class="note">${esc(s.note)}</span>`:''}</div>
 <div class="stage">${svgFor(e,s,st)}</div>
 <div class="ctl">${['arm','arm2','leg','leg2','body','drop','lean'].map(f=>`<label><input type="checkbox" data-f="${f}" ${on(f)}>${f}</label>`).join('')}
 <label><input type="checkbox" data-f="reach" ${on('reach')}>reach <input type="number" step="0.05" min="0" max="1.5" style="width:70px" data-reach value="${st.reach??''}" placeholder="auto"></label></div>
 <div class="ctl"><label title="An optional chain of three points hanging from the pelvis, to follow a tail or similar part. Not exported."><input type="checkbox" data-tail ${st.tail?'checked':''}>tail</label>${[['shR','R shoulder'],['shL','L shoulder'],['heR','R head edge'],['heL','L head edge']].map(([k,n])=>`<label title="Optional reference point (anatomical right or left), not exported."><input type="checkbox" data-opt="${k}" ${st.opt&&st.opt[k]?'checked':''}>${n}</label>`).join('')}<label title="Optional reference point at the end of the hand, following the wrist. Not exported."><input type="checkbox" data-tip="arm" ${st.tips&&st.tips.arm?'checked':''}>${st.side===1?'R':'L'} fingertip</label><label title="Optional reference point at the end of the other hand. Not exported."><input type="checkbox" data-tip="arm2" ${st.tips&&st.tips.arm2?'checked':''}>${st.side===1?'L':'R'} fingertip</label><label>active side <select data-side><option value="1" ${st.side===1?'selected':''}>R (+1)</option><option value="-1" ${st.side===-1?'selected':''}>L (-1)</option></select></label>
 <button data-act="reset">Reset</button><button data-act="prev">Copy previous</button><label><input type="checkbox" data-act="rev" ${st.reviewed?'checked':''}>reviewed</label></div>
 <div class="out">${readout(e,s,st)}</div></section>`}
function render(){const e=DATA.entries[cur],hide=$('#hideDone').checked;nav();stats();
 const also=e.alsoApplies.length?` Also applied to animations ${e.alsoApplies.join(', ')} (same sprites).`:'';
 const sys=e.sharedWithSystem.length?` Shares sprites with state animations ${e.sharedWithSystem.join(', ')}; those are not changed.`:'';
 $('#main').innerHTML=`<h2 class="title">${e.harName} anim ${e.animation} &middot; ${esc(e.name)}</h2><div class="meta">input <code>${esc(e.input)}</code>.${also}${sys}</div>
 <p class="help">The <i>reference</i> menu at the top switches the picture under the skeleton between the original sprite, the remastered HD frame of the same pose (about five times the resolution, easier to see hidden elbows and knees) and a blend of the two. Joints and handles can be dragged anywhere in the dark margin around the sprite too. Drag the yellow and coloured joints onto the sprite's elbow, wrist, knee and ankle (the purple chain is the other, left-side arm; it is dimmed until you move it, which ticks <i>arm2</i>); the pink pelvis joint moves the body forward or back and, vertically, sets the body height (<i>drop</i>). The skeleton is one chain: the pelvis is its root, the spine runs from the pelvis to the neck joint, the legs hang from the pelvis and the arms from the shoulder on the spine. Dragging the pelvis moves the whole body (sideways = <i>body</i> z, vertically = <i>drop</i>); dragging the neck joint tilts the spine, and <i>lean</i> exports that tilt. The head is drawn separately (the neck is joined to its top): its top and two edge points (the back and the front of the head, relative to the way the fighter faces, not to the screen) are joined into an outline and move independently of the neck, so you can place them on the sprite's head; moving the pelvis moves them with the body. They are a reference and are not exported. The optional <i>tail</i> adds three more reference points hanging from the pelvis, and each arm has an optional <i>fingertip</i> point that follows its wrist. Optional <i>R/L shoulder</i> and <i>R/L head edge</i> points (the character's anatomical right and left, useful when the body turns toward the camera) can be switched on as well; once a shoulder point is on, that arm is drawn from it. All of these are references and none is exported. The dotted vertical line is rig z = 0, the idle torso line. R and L mark the character's right (+x, side +1) and left (side -1) limbs; <i>active side</i> chooses which side the arm and leg override. Heights and depths shown below are the rig values that will be exported. Tick <i>reviewed</i> when a frame is right; unreviewed frames are not exported, and only the parts ticked on a reviewed frame are written, so you can export one move, a few frames, or just the legs.</p>
 <div class="cards">${e.sprites.map((s,i)=>(hide&&saved[key(e,s)]?.reviewed)?'':card(e,s,i)).join('')}</div>`}
function refreshCard(c){const e=DATA.entries[cur],s=e.sprites[+c.dataset.i],st=state(e,s);c.querySelector('.stage').innerHTML=svgFor(e,s,st);c.querySelector('.out').textContent=readout(e,s,st);c.classList.toggle('reviewed',st.reviewed)}
let drag=null;
$('#main').addEventListener('pointerdown',ev=>{const c=ev.target.closest('.j');if(!c)return;ev.preventDefault();drag={id:c.dataset.id,card:c.closest('.card')}});
document.addEventListener('pointermove',ev=>{if(!drag)return;const e=DATA.entries[cur],s=e.sprites[+drag.card.dataset.i],st=state(e,s),sv=drag.card.querySelector('svg');
 const pt=sv.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse()),x=q.x+s.ox,y=-(q.y+s.oy),id=drag.id,sk=st.skel;
 const mv=(pts,dx,dy)=>pts.forEach(p=>{p[0]+=dx;p[1]+=dy}),hp=()=>[sk.head.top,sk.head.left,sk.head.right];
 if(id==='neck'){mv([sk.neck],x-sk.neck[0],y-sk.neck[1]);if(Math.abs(leanOf(e,st))>.02&&!st.flags.includes('lean'))st.flags.push('lean')}else if(id==='headTop')sk.head.top=[x,y];else if(id==='headL')sk.head.left=[x,y];else if(id==='headR')sk.head.right=[x,y];else if(id==='elbow')sk.elbow=[x,y];else if(id==='wrist'){if(st.tips&&st.tips.arm)mv([st.tips.arm],x-sk.wrist[0],y-sk.wrist[1]);sk.wrist=[x,y]}else if(id==='tipArm')st.tips.arm=[x,y];else if(id==='tipArm2')st.tips.arm2=[x,y];else if(id==='elbow2'||id==='wrist2'){if(id==='wrist2'&&st.tips&&st.tips.arm2)mv([st.tips.arm2],x-sk.wrist2[0],y-sk.wrist2[1]);sk[id]=[x,y];if(!st.flags.includes('arm2'))st.flags.push('arm2')}else if(id==='pelvis'){mv([sk.pelvis,sk.neck,...hp(),...(st.tail||[]),...Object.values(st.opt||{}).filter(Boolean)],x-sk.pelvis[0],y-sk.pelvis[1]);if(Math.abs(y-s.skel.pelvis[1])>1&&!st.flags.includes('drop'))st.flags.push('drop')}
 else if(id==='shR'||id==='shL'||id==='heR'||id==='heL')st.opt[id]=[x,y];

 else{const n=+id.slice(-1);sk.legs[n][id.startsWith('knee')?'knee':'ankle']=[x,y]}

document.addEventListener('pointerup',()=>{if(drag){persist();drag=null}});
$('#main').addEventListener('change',ev=>{const c=ev.target.closest('.card');if(!c)return;const e=DATA.entries[cur],s=e.sprites[+c.dataset.i],st=state(e,s),t=ev.target;
 if('tip' in t.dataset){const w=t.dataset.tip==='arm'?st.skel.wrist:st.skel.wrist2,el=t.dataset.tip==='arm'?st.skel.elbow:st.skel.elbow2,dx=w[0]-el[0],dy=w[1]-el[1],n=Math.hypot(dx,dy)||1;st.tips[t.dataset.tip]=t.checked?[w[0]+dx/n*7,w[1]+dy/n*7]:null}
 if('opt' in t.dataset){const k=t.dataset.opt,q=st.skel,sh=[q.pelvis[0]+(q.neck[0]-q.pelvis[0])*.72,q.pelvis[1]+(q.neck[1]-q.pelvis[1])*.72],hc=[(q.head.left[0]+q.head.right[0])/2,(q.head.left[1]+q.head.right[1])/2],base=k.startsWith('sh')?sh:hc;st.opt[k]=t.checked?[base[0]+(k.endsWith('R')?3:-3),base[1]]:null}

$('#main').addEventListener('click',ev=>{const b=ev.target.closest('button[data-act]');if(!b)return;const c=b.closest('.card'),e=DATA.entries[cur],i=+c.dataset.i,s=e.sprites[i],st=state(e,s);
 if(b.dataset.act==='reset'){delete saved[key(e,s)]}

$('#hideDone').addEventListener('input',render);

$('#clearBtn').addEventListener('click',()=>{if(confirm('Forget every edit stored in this browser?')){saved={};persist();render()}});
const FIELDS=['har','animation','sprite','side','flags','reach','elbow_y','elbow_z','wrist_y','wrist_z','knee_y','knee_z','ankle_y','ankle_z','knee2_y','knee2_z','ankle2_y','ankle2_z','body_z','lean','elbow2_y','elbow2_z','wrist2_y','wrist2_z','body_y'];
function rowFor(e,s,st,anim){const r=Object.fromEntries(FIELDS.map(f=>[f,'']));const fl=[...new Set(st.flags)];
 const order=['reach','arm','arm2','leg','leg2','body','drop','lean','fist'];let flags=order.filter(f=>fl.includes(f));
 Object.assign(r,{har:e.har,animation:anim,sprite:s.sprite,side:st.side});
 const dd=dropOf(e,st);
 if(fl.includes('arm')){const a=rig(e,s,st.skel.elbow),w=rig(e,s,st.skel.wrist);Object.assign(r,{elbow_y:f2(a[0]-dd),elbow_z:f2(a[1]),wrist_y:f2(w[0]-dd),wrist_z:f2(w[1])})}
 if(fl.includes('arm2')){const a=rig(e,s,st.skel.elbow2),w=rig(e,s,st.skel.wrist2);Object.assign(r,{elbow2_y:f2(a[0]-dd),elbow2_z:f2(a[1]),wrist2_y:f2(w[0]-dd),wrist2_z:f2(w[1])})}
 if(fl.includes('drop'))r.body_y=f2(dd);
 if(fl.includes('leg')){const k=rig(e,s,st.skel.legs[0].knee),a=rig(e,s,st.skel.legs[0].ankle);Object.assign(r,{knee_y:f2(k[0]),knee_z:f2(k[1]),ankle_y:f2(a[0]),ankle_z:f2(a[1])})}
 if(fl.includes('leg2')){const k=rig(e,s,st.skel.legs[1].knee),a=rig(e,s,st.skel.legs[1].ankle);Object.assign(r,{knee2_y:f2(k[0]),knee2_z:f2(k[1]),ankle2_y:f2(a[0]),ankle2_z:f2(a[1])})}
 if(fl.includes('body'))r.body_z=f2(-(st.skel.pelvis[0]-st.axis)*DATA.unit);
 if(fl.includes('lean'))r.lean=f2(leanOf(e,st));
 if(fl.includes('reach')){const w=rig(e,s,st.skel.wrist);r.reach=f2(st.reach??Math.max(0,Math.min(1,-w[1]/1.7)))}
 r.flags=flags.join('|');return r}
function exportRows(entries){const rows=[];
 for(const e of entries)for(const s of e.sprites){const st=saved[key(e,s)];if(!st?.reviewed||!st.flags.length)continue;for(const a of [e.animation,...e.alsoApplies])rows.push(rowFor(e,s,st,a))}
 if(!rows.length){alert('No reviewed sprites to export. Tick "reviewed" on the frames you want; any subset works, and only their ticked parts are written.');return}
 const csv=[FIELDS.join(','),...rows.map(r=>FIELDS.map(f=>r[f]).join(','))].join('\n')+'\n';
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
 a.download=entries.length===1?`pose-rows-${entries[0].harName.toLowerCase()}-${entries[0].animation}.csv`:'pose-rows.csv';a.click()}
$('#exportBtn').addEventListener('click',()=>exportRows(DATA.entries));
$('#exportMoveBtn').addEventListener('click',()=>exportRows([DATA.entries[cur]]));
render();
